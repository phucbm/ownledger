name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli/index.js check fixtures/demo
      - name: Worker end to end (dev mode, demo data)
        run: |
          node dist/cli/index.js dev fixtures/demo --port 8787 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8787/ && break; sleep 1; done
          node scripts/smoke-mcp.mjs http://localhost:8787 || (cat dev.log; exit 1)
